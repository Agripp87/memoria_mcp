<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memoria demo animation</title>
<!--
  Source for marketing/video/demo.mp4 and demo.gif. A scripted animation, not a
  screen recording: nothing here needs a Claude login.

  What is real: every Memoria tool result, the Markdown file, the sync log
  lines, the merged daily log and the dashboard screenshots. They come from
  one continuous run of the actual server (0.3.2, local MiniLM embeddings) and
  the actual sync hook scripts, against two clones of the generated demo store
  ("laptop" and "desktop") with a bare git remote between them.

  What is scripted: the user prompts and Claude's replies, which are written
  from those results.

  The page is driven by window.seek(seconds), so render.mjs can capture it
  frame by frame. Open it in a browser to watch it in real time (silent: the
  narration is mixed in by render.mjs), add ?t=12.5 to freeze on one moment,
  or ?cut=short for the 30-second version.
-->
<style>
  :root {
    --bg: #0e0f14; --panel: #14151d; --line: #2a2b3b; --text: #edecf6;
    --muted: #9c9cb4; --dim: #6c6c85; --accent: #a7a2ff; --green: #7fe0a4; --amber: #f0c674;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Inter Display", "Inter", sans-serif; color: var(--text);
    background:
      radial-gradient(1100px 700px at 0% 100%, rgba(167,162,255,.10), transparent 60%),
      radial-gradient(800px 600px at 100% 0%, rgba(127,224,164,.05), transparent 60%),
      var(--bg);
  }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .win {
    position: absolute; left: 150px; top: 96px; width: 1620px; height: 764px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 50px 110px rgba(0,0,0,.5); overflow: hidden;
  }
  .bar {
    height: 58px; display: flex; align-items: center; gap: 11px; padding: 0 26px;
    border-bottom: 1px solid var(--line); color: var(--dim);
    font-family: "JetBrains Mono", monospace; font-size: 21px;
  }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #34354a; display: block; }
  .bar span { margin-left: 16px; }
  .view { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; overflow: hidden; }
  .term {
    position: absolute; left: 0; right: 0; top: 0; padding: 28px 40px 30px;
    font-family: "JetBrains Mono", monospace; font-size: 27px; line-height: 1.52;
    color: #c9c8dc; white-space: pre-wrap;
  }
  .ln { display: none; min-height: 1.52em; }
  .k { color: var(--accent); } .g { color: var(--green); } .d { color: var(--dim); }
  .w { color: var(--text); } .b { color: var(--text); font-weight: 700; } .y { color: var(--amber); }
  .cur { display: inline-block; width: .6em; height: 1.08em; background: var(--accent); vertical-align: -0.18em; margin-left: 2px; }

  /* Which machine we are on, and what part of the story this is. */
  .where {
    position: absolute; left: 150px; top: 36px; display: flex; align-items: center; gap: 16px;
    font-family: "JetBrains Mono", monospace; font-size: 22px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim); opacity: 0;
  }
  .where b { color: var(--text); font-weight: 500; }
  .where .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
  .where.desktop .dot { background: var(--green); }

  .caption {
    position: absolute; left: 110px; right: 110px; top: 898px; text-align: center;
    font-size: 52px; font-weight: 650; letter-spacing: -.028em; opacity: 0;
  }
  .caption em { font-style: normal; color: var(--accent); }
  .tag { position: absolute; left: 150px; bottom: 34px; font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
  .note {
    position: absolute; right: 150px; bottom: 38px; color: var(--dim);
    font-family: "JetBrains Mono", monospace; font-size: 18px;
  }

  /* dashboard scene: real screenshots, cross-faded */
  .shotwrap {
    position: absolute; left: 150px; top: 96px; width: 1620px; height: 764px;
    border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
    box-shadow: 0 50px 110px rgba(0,0,0,.5); background: #0f1016;
  }
  .shot { position: absolute; left: 0; top: 0; width: 1620px; height: 790px; opacity: 0; transform-origin: 0 0; }
  .shot img { display: block; width: 1620px; }
  .ring {
    position: absolute; border: 3px solid var(--accent); border-radius: 10px;
    box-shadow: 0 0 0 6px rgba(167,162,255,.18); opacity: 0;
  }

  /* end card */
  #end { display: grid; grid-template-columns: 1fr 1fr; gap: 90px; align-items: center; padding: 0 150px 60px; }
  #end .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 25px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin-bottom: 30px; }
  #end h1 { font-size: 176px; line-height: .95; font-weight: 800; letter-spacing: -.045em; }
  #end p { font-size: 42px; line-height: 1.32; color: var(--muted); margin-top: 36px; }
  #end p b { color: var(--text); font-weight: 600; }
  #end .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; font-family: "JetBrains Mono", monospace; font-size: 29px; line-height: 1.7; }
  #end .panel .body { padding: 30px 36px 34px; white-space: pre; color: #c9c8dc; }
  #end .url { margin-top: 34px; font-family: "JetBrains Mono", monospace; font-size: 29px; color: var(--accent); }
  #end .lic { color: var(--dim); }
</style>
</head>
<body>

<div id="terms"></div>

<section class="scene" id="s-dash">
  <div class="shotwrap">
    <div class="shot" id="shot-overview"><img src="dash-overview.png" alt=""></div>
    <div class="shot" id="shot-search"><img src="dash-search.png" alt=""></div>
    <div class="shot" id="shot-wiki"><img src="dash-wiki.png" alt="">
      <div class="ring" id="ring" style="left:1212px; top:481px; width:250px; height:38px"></div>
    </div>
    <div class="shot" id="shot-journal"><img src="dash-journal.png" alt=""></div>
  </div>
</section>

<section class="scene" id="end">
  <div>
    <div class="eyebrow">Open-source MCP server</div>
    <h1>Memoria</h1>
    <p>Long-term memory for Claude, as <b>a Markdown repo you own</b>.</p>
  </div>
  <div>
    <div class="panel">
      <div class="bar"><i></i><i></i><i></i><span>in Claude Code</span></div>
<div class="body"><span class="g">/plugin</span> marketplace add Agripp87/memoria_mcp
<span class="g">/plugin</span> install memoria@memoria</div>
    </div>
    <div class="url">github.com/Agripp87/memoria_mcp <span class="lic">· Apache-2.0</span></div>
  </div>
</section>

<div class="where" id="where"><span class="dot"></span><b></b><span></span></div>
<div class="caption" id="cap"></div>
<div class="tag" id="tag">Memoria</div>
<div class="note" id="note">Illustration · Memoria output is real, from the demo store</div>

<script>
/* ---------- script of the film ----------
   Times inside a scene are seconds from that scene's start.
   A line with `type` is revealed character by character over that many
   seconds; without it the line appears whole. `html` is trusted markup. */

const P = (s) => `<span class="k">&gt;</span> <span class="w">${s}</span>`;          // user prompt
const A = (s) => `<span class="g">●</span> <span class="w">${s}</span>`;             // Claude's reply
const T = (tool, arg) => `<span class="g">●</span> <span class="b">memoria</span> <span class="d">·</span> ${tool}<span class="d">(</span><span class="y">"${arg}"</span><span class="d">)</span>`;
const SH = (s) => `<span class="g">$</span> <span class="w">${s}</span>`;               // shell command
const C = (s) => `<span class="d"># ${s}</span>`;                                     // comment
const D = '<span class="d">score</span>';

let TERMS = [
  { // 1. A session on the laptop: recall, then record.
    id: 'laptop-chat', start: 0, end: 19.4, title: 'claude · ~/code/atlas-api',
    where: ['laptop', 'a Claude Code session'],
    lines: [
      { at: 0.9, type: 2.6, html: P('Which database are we using for Atlas API, and why?') },
      { at: 3.8, html: '' },
      { at: 3.9, html: T('memory_search', 'Atlas API database decision') },
      { at: 4.8, html: `  <span class="d">└</span> 1. daily/2026-11-11.md                ${D} 0.499` },
      { at: 5.0, html: `    2. <span class="w">decisions/postgres-over-mongo.md</span>   ${D} 0.497` },
      { at: 5.2, html: `    3. daily/2026-11-10.md                ${D} 0.492` },
      { at: 5.8, html: '' },
      { at: 5.9, type: 3.3, html: A("Postgres. You chose it over Mongo for Atlas API: shared notebooks\n  and sync cursors needed relational integrity, and Mongo's flexible\n  schema wasn't worth losing transactions and joins.") },
      { at: 11.2, html: '' },
      { at: 11.4, type: 3.2, html: P("We're moving the job queue to Postgres too, with SKIP LOCKED.\n  Remember that.") },
      { at: 14.9, html: '' },
      { at: 15.0, html: T('memory_write', 'decisions/job-queue-postgres.md') },
      { at: 15.9, html: '  <span class="d">└</span> Written: decisions/job-queue-postgres.md (1 chunks indexed)' },
      { at: 16.4, html: '' },
      { at: 16.5, type: 1.4, html: A('Saved as a decision, linked to the Postgres-over-Mongo note.') },
    ],
  },
  { // 2. The memory is a file.
    id: 'laptop-file', start: 19.4, end: 27.0, title: 'zsh · ~/.memoria',
    where: ['laptop', 'the memory store'],
    lines: [
      { at: 0.6, type: 1.8, html: SH('head -15 memories/decisions/job-queue-postgres.md') },
      ...[
        '<span class="d">---</span>',
        '<span class="k">name:</span> <span class="g">Job queue on Postgres</span>',
        '<span class="k">description:</span> Moved the Atlas API job queue to Postgres with SKIP LOCKED',
        '<span class="k">type:</span> decision',
        '<span class="k">importance:</span> 6',
        '<span class="k">created:</span> 2026-11-19',
        '<span class="k">updated:</span> 2026-11-19',
        '<span class="k">tags:</span> [architecture, database, queue]',
        '<span class="k">related:</span> [decisions/postgres-over-mongo.md, project/atlas-api.md]',
        '<span class="d">---</span>',
        '',
        '<span class="b">## Decision: job queue on Postgres</span>',
        '',
        '**Decision:** move the Atlas API job queue to Postgres, using',
        '`SELECT ... FOR UPDATE SKIP LOCKED`.',
      ].map((html, i) => ({ at: 2.7 + i * 0.08, html })),
    ],
  },
  { // 3. The Stop hook publishes the store.
    id: 'laptop-push', start: 27.0, end: 34.0, title: 'zsh · ~/.memoria',
    where: ['laptop', 'Claude stops'],
    lines: [
      { at: 0.5, html: C("The plugin's Stop hook ran scripts/sync/memoria-sync-push.sh") },
      { at: 1.0, type: 1.1, html: SH('tail -2 .sync.log') },
      { at: 2.4, html: '<span class="d">[2026-11-19T02:15:23+00:00]</span> push: committed session changes' },
      { at: 2.7, html: '<span class="d">[2026-11-19T02:15:23+00:00]</span> push: <span class="g">pushed to origin/main</span>' },
      { at: 3.6, html: '' },
      { at: 3.7, html: C('origin is your own private git repo. There is no Memoria service.') },
    ],
  },
  { // 4. Another machine: the SessionStart hook pulls, and Claude finds the decision.
    id: 'desktop-chat', start: 34.0, end: 50.0, title: 'claude · ~/code/atlas-api', desktop: true,
    where: ['desktop', 'a new session on another machine'],
    lines: [
      { at: 0.5, html: C('The SessionStart hook ran scripts/sync/memoria-sync-pull.sh') },
      { at: 1.0, type: 1.3, html: SH('grep pull: ~/.memoria/.sync.log') },
      { at: 2.6, html: '<span class="d">[2026-11-19T02:15:23+00:00]</span> pull: committed unflushed local changes before pulling' },
      { at: 2.9, html: '<span class="d">[2026-11-19T02:15:24+00:00]</span> pull: <span class="g">merged 1 commit(s) from origin/main</span>' },
      { at: 5.6, html: '' },
      { at: 5.8, type: 1.7, html: P('What do we use for the job queue?') },
      { at: 7.8, html: '' },
      { at: 7.9, html: T('memory_search', 'what do we use for the job queue?') },
      { at: 8.8, html: `  <span class="d">└</span> 1. <span class="w">decisions/job-queue-postgres.md</span>   ${D} 0.528` },
      { at: 9.0, html: `    2. daily/2026-11-19.md               ${D} 0.475` },
      { at: 9.6, html: '' },
      { at: 9.7, type: 2.8, html: A('Postgres, with SELECT ... FOR UPDATE SKIP LOCKED: one less service\n  to run, and jobs commit in the same transaction as their data.') },
    ],
  },
  { // 5. Both machines wrote to today's log. The union merge kept both.
    id: 'desktop-merge', start: 50.0, end: 60.0, title: 'zsh · ~/.memoria', desktop: true,
    where: ['desktop', 'one day, two machines writing'],
    lines: [
      { at: 0.6, type: 1.5, html: SH('tail -6 memories/daily/2026-11-19.md') },
      { at: 2.3, html: '<span class="b">## 02:13 UTC — note</span>' },
      { at: 2.3, html: '' },
      { at: 2.3, html: 'Fixed the sync cursor off-by-one in Atlas API. Regression test added first.' },
      { at: 2.5, html: '<span class="b">## 02:15 UTC — note</span>' },
      { at: 2.5, html: '' },
      { at: 2.5, html: 'Moved the Atlas API job queue to Postgres (SKIP LOCKED). See decisions/job-queue-postgres.md.' },
      { at: 5.2, html: '' },
      { at: 5.3, type: 1.3, html: SH("grep '^memories' .gitattributes") },
      { at: 6.8, html: '<span class="k">memories/daily/*.md</span> <span class="g">merge=union</span>' },
      { at: 6.9, html: '<span class="k">memories/MEMORY_INDEX.md</span> <span class="g">merge=union</span>' },
    ],
  },
];

let DASH_START = 60.0;
// [id, seconds on screen]
let SHOTS = [['shot-overview', 4.2], ['shot-search', 4.6], ['shot-wiki', 5.2], ['shot-journal', 4.4]];
let END_CARD = 5.6;

// [start, end, caption html] in film time.
let CAPTIONS = [
  [0.3, 3.7, 'Every session starts from zero.'],
  [3.9, 11.1, 'Unless Claude can <em>remember</em>.'],
  [11.3, 19.2, 'Decisions are written down as you work.'],
  [19.6, 26.8, 'Every memory is a <em>Markdown file</em> you own.'],
  [27.2, 33.8, 'When Claude stops, a hook <em>commits and pushes</em> the store.'],
  [34.2, 39.4, 'On another machine, the next session <em>pulls first</em>.'],
  [39.6, 49.8, 'What you decided on the laptop is already there.'],
  [50.2, 55.0, "Both machines wrote to today's log. <em>Both entries kept.</em>"],
  [55.2, 59.8, 'A git <em>union merge</em>. No sync service.'],
  [60.2, 64.0, 'A dashboard on the <em>same files</em>.'],
  [64.4, 68.6, 'Search with the ranking Claude uses.'],
  [69.0, 73.8, 'A wiki of your memory, with <em>backlinks</em>.'],
  [74.2, 78.2, 'A journal for what only you know.'],
];

// Narration: [start, clip in audio/]. render.mjs mixes these into the video.
// Each clip is one sentence or two, generated with ElevenLabs (voice "Aabo").
let AUDIO = [
  [0.4, 'intro'],      // Every Claude Code session starts from zero. With Memoria, Claude searches...
  [11.5, 'write'],     // When you make a new decision, Claude writes it down.
  [19.8, 'file'],      // Every memory is a plain Markdown file, in a folder you own.
  [27.4, 'push'],      // When Claude stops, a hook commits the store and pushes it to your own private git repository.
  [34.4, 'pull'],      // On another machine, the next session pulls first.
  [40.0, 'ask'],       // Ask a question there, and the decision you made on the laptop is already waiting.
  [50.4, 'merge'],     // If both machines wrote to today's log, git's union merge keeps both entries. No conflicts, and no sync service.
  [60.3, 'dash'],      // The dashboard reads the same files.
  [64.5, 'search'],    // Search them with the same ranking Claude uses.
  [69.1, 'wiki'],      // Browse your memory as a wiki, with backlinks between notes.
  [74.4, 'journal'],   // And add notes of your own in the journal.
  [78.9, 'outro'],     // Memoria. Open source, and two commands to install.
];

/* ---------- the 30-second cut (demo.html?cut=short) ----------
   Same captured output, fewer beats: record a decision, see the file, find it
   on the other machine, browse the wiki. */
const CUT = new URLSearchParams(location.search).get('cut') === 'short' ? 'short' : 'full';
if (CUT === 'short') {
  const full = Object.fromEntries(TERMS.map((s) => [s.id, s]));
  TERMS = [
    { id: 'laptop-chat', start: 0, end: 7.0, title: 'claude · ~/code/atlas-api',
      where: ['laptop', 'a Claude Code session'],
      lines: [
        { at: 0.4, type: 2.4, html: P("We're moving the job queue to Postgres, with SKIP LOCKED.\n  Remember that.") },
        { at: 3.0, html: '' },
        { at: 3.1, html: T('memory_write', 'decisions/job-queue-postgres.md') },
        { at: 3.8, html: '  <span class="d">└</span> Written: decisions/job-queue-postgres.md (1 chunks indexed)' },
        { at: 4.1, html: '' },
        { at: 4.2, type: 1.2, html: A('Saved as a decision, linked to the Postgres-over-Mongo note.') },
      ] },
    { id: 'laptop-file', start: 7.0, end: 12.5, title: 'zsh · ~/.memoria',
      where: ['laptop', 'the memory store'],
      lines: full['laptop-file'].lines.map((l, i) => i === 0
        ? { at: 0.3, type: 1.0, html: l.html }
        : { at: 1.5 + (i - 1) * 0.05, html: l.html }) },
    { id: 'desktop-chat', start: 12.5, end: 21.0, title: 'claude · ~/code/atlas-api', desktop: true,
      where: ['desktop', 'a new session on another machine'],
      lines: [
        { at: 0.3, html: C('The SessionStart hook ran scripts/sync/memoria-sync-pull.sh') },
        { at: 0.5, type: 0.7, html: SH('grep pull: ~/.memoria/.sync.log') },
        { at: 1.3, html: '<span class="d">[2026-11-19T02:15:23+00:00]</span> pull: committed unflushed local changes before pulling' },
        { at: 1.5, html: '<span class="d">[2026-11-19T02:15:24+00:00]</span> pull: <span class="g">merged 1 commit(s) from origin/main</span>' },
        { at: 2.1, html: '' },
        { at: 2.2, type: 1.2, html: P('What do we use for the job queue?') },
        { at: 3.6, html: '' },
        { at: 3.7, html: T('memory_search', 'what do we use for the job queue?') },
        { at: 4.3, html: `  <span class="d">└</span> 1. <span class="w">decisions/job-queue-postgres.md</span>   ${D} 0.528` },
        { at: 4.5, html: `    2. daily/2026-11-19.md               ${D} 0.475` },
        { at: 4.8, html: '' },
        { at: 4.9, type: 2.0, html: A('Postgres, with SELECT ... FOR UPDATE SKIP LOCKED: one less service\n  to run, and jobs commit in the same transaction as their data.') },
      ] },
  ];
  DASH_START = 21.0;
  SHOTS = [['shot-wiki', 4.4]];
  END_CARD = 4.6;
  CAPTIONS = [
    [0.2, 6.8, 'Claude <em>remembers</em> what you decide.'],
    [7.2, 12.3, 'Every memory is a <em>Markdown file</em> you own.'],
    [12.7, 20.8, 'Synced with <em>git</em> to every machine.'],
    [21.2, 25.2, 'Browse it like a wiki.'],
  ];
  AUDIO = [
    [0.3, 'shortintro'],  // Claude Code forgets between sessions. Memoria lets it remember.
    [7.3, 'file'],
    [12.8, 'gitsync'],    // Git syncs it to your other machines, so the next session there already knows.
    [21.2, 'wiki'],
    [25.9, 'outro'],
  ];
}
const DASH_END = DASH_START + SHOTS.reduce((s, x) => s + x[1], 0);
const DURATION = DASH_END + END_CARD;   // 84 s full, 30 s short

/* ---------- engine ---------- */
const FADE = 0.35;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => x * x * (3 - 2 * x);
const fade = (t, a, b) => ease(clamp((t - a) / FADE)) * ease(clamp((b - t) / FADE));

const host = document.getElementById('terms');
for (const s of TERMS) {
  const sec = document.createElement('section');
  sec.className = 'scene';
  sec.innerHTML = `<div class="win"><div class="bar"><i></i><i></i><i></i><span>${s.title}</span></div><div class="view"><div class="term"></div></div></div>`;
  host.appendChild(sec);
  s.sec = sec;
  s.term = sec.querySelector('.term');
  for (const l of s.lines) {
    const d = document.createElement('div');
    d.className = 'ln';
    d.innerHTML = l.html;
    // Collect text nodes so typing can reveal characters without touching markup.
    const walker = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
    l.nodes = [];
    for (let n = walker.nextNode(); n; n = walker.nextNode()) l.nodes.push({ n, full: n.nodeValue });
    l.total = l.nodes.reduce((sum, x) => sum + x.full.length, 0);
    l.el = d;
    l.cur = document.createElement('span');
    l.cur.className = 'cur';
    s.term.appendChild(d);
  }
}

function draw(s, t) {
  let active = null;
  for (const l of s.lines) {
    const on = t >= l.at;
    l.el.style.display = on ? 'block' : 'none';
    if (l.cur.parentNode) l.cur.remove();
    if (!on) continue;
    const frac = l.type ? clamp((t - l.at) / l.type) : 1;
    let left = Math.round(l.total * frac);
    for (const x of l.nodes) {
      const take = Math.min(left, x.full.length);
      x.n.nodeValue = x.full.slice(0, take);
      left -= take;
    }
    if (l.type && t < l.at + l.type + 0.5) active = l;
  }
  if (active) {
    // Solid while typing, blinking once the line is complete.
    const typing = t < active.at + active.type;
    if (typing || Math.floor(t * 2.5) % 2 === 0) {
      active.nodes[active.nodes.length - 1].n.parentNode.appendChild(active.cur);
    }
  }
  // Behave like a terminal: once the text is taller than the window, scroll.
  const over = s.term.scrollHeight - s.term.parentNode.clientHeight;
  s.term.style.transform = `translateY(${-Math.max(0, over)}px)`;
}

const cap = document.getElementById('cap');
const where = document.getElementById('where');
const dash = document.getElementById('s-dash');
const ring = document.getElementById('ring');
let capKey = -2, whereKey = -2;

window.DURATION = DURATION;
window.AUDIO = AUDIO;
window.CUT = CUT;
window.seek = function (t) {
  // Terminal scenes.
  let cur = -1;
  TERMS.forEach((s, i) => {
    s.sec.style.opacity = fade(t, s.start, s.end + FADE * 0.5);
    draw(s, t - s.start);
    if (t >= s.start && t < s.end) cur = i;
  });

  // Machine label.
  if (cur !== whereKey) {
    whereKey = cur;
    if (cur >= 0) {
      const s = TERMS[cur];
      where.className = 'where' + (s.desktop ? ' desktop' : '');
      where.children[1].textContent = s.where[0];
      where.children[2].textContent = '· ' + s.where[1];
    }
  }
  const inDash = t >= DASH_START && t < DASH_END;
  if (inDash && whereKey !== 'dash') {
    whereKey = 'dash';
    where.className = 'where desktop';
    where.children[1].textContent = 'dashboard';
    where.children[2].textContent = '· the same store, in a browser';
  }
  where.style.opacity = inDash ? fade(t, DASH_START + 0.1, DASH_END)
    : cur < 0 ? 0 : fade(t, TERMS[cur].start + 0.1, TERMS[cur].end);

  // Dashboard: each screenshot fades in over the last and drifts slightly.
  dash.style.opacity = fade(t, DASH_START, DASH_END + FADE * 0.5);
  let a = DASH_START;
  for (const [id, len] of SHOTS) {
    const el = document.getElementById(id);
    el.style.opacity = ease(clamp((t - a) / 0.45));
    el.style.transform = `scale(${1 + 0.025 * clamp((t - a) / len)})`;
    if (id === 'shot-wiki') ring.style.opacity = fade(t, a + 1.0, a + len);
    a += len;
  }

  // Caption.
  const i = CAPTIONS.findIndex(([x, y]) => t >= x && t <= y);
  if (i !== capKey) { capKey = i; cap.innerHTML = i < 0 ? '' : CAPTIONS[i][2]; }
  cap.style.opacity = i < 0 ? 0 : fade(t, CAPTIONS[i][0], CAPTIONS[i][1]);

  // End card; the corner mark and the note give way to it.
  const endIn = fade(t, DASH_END, DURATION + 1);
  document.getElementById('end').style.opacity = endIn;
  document.getElementById('tag').style.opacity = 1 - endIn;
  document.getElementById('note').style.opacity = 1 - endIn;
};

const fixed = new URLSearchParams(location.search).get('t');
if (fixed !== null) {
  window.seek(parseFloat(fixed));
} else if (!navigator.webdriver) {
  const t0 = performance.now();
  (function tick() {
    window.seek(((performance.now() - t0) / 1000) % (DURATION + 1));
    requestAnimationFrame(tick);
  })();
} else {
  window.seek(0);
}
</script>
</body>
</html>
