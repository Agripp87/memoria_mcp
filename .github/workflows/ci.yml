name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript build (mcp-server, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu matches the production runtime; windows is the primary
        # development platform. Without the windows leg, path-separator bugs
        # (getRelativePath emits "/" while path.sep is "\\") fail only on the
        # developer's machine and stay green on main indefinitely.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Match the production runtime (Docker image is node:22-alpine).
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      # Coverage thresholds gate merges on the production platform only, so the
      # per-file floors in vitest.config.ts have a single source of truth.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage
      - if: matrix.os != 'ubuntu-latest'
        run: npm test

  lint:
    name: Lint + format (mcp-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      # ESLint fails on errors only; `no-explicit-any` is a warning by design
      # (see eslint.config.js) so it does not block a merge.
      - run: npm run lint
      - run: npm run format:check

  python:
    name: Python syntax (integrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m compileall -q integrations

  shell:
    name: Shellcheck (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --severity=warning scripts/*.sh scripts/sync/*.sh deploy/gcp/*.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The public repo must never contain a credential or a memory file. This
      # scans the full history on every push/PR and fails the build on a hit.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
