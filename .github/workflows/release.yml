name: Release

# STAGES mcp-server on npm when a version tag is pushed. Nothing goes public
# until the maintainer approves it with 2FA:
#
#     npx -y npm@11 stage approve @agrippa87/memoria-mcp@X.Y.Z
#
# The workflow authenticates with npm trusted publishing: it proves its
# identity over OIDC, so no npm token is stored anywhere to leak, and npm
# attaches a provenance attestation tying the tarball to this commit.
#
# Why staged rather than published directly: main is unprotected and has a
# single admin, so anything able to push a tag here — the maintainer's GitHub
# session, or a gh token on a development machine — could otherwise publish
# to npm under the maintainer's name. Staging keeps a human, and a second
# factor, between a tag and a public release.
#
# Release:    bump mcp-server/package.json, cut the CHANGELOG section, merge,
#             tag:   git tag -a vX.Y.Z -m "..." && git push public vX.Y.Z
#             then approve with the command above (the run summary prints it).
# Rehearsal:  run this workflow manually (Actions tab → Release → Run
#             workflow). It runs everything and stages a throwaway pre-release
#             version with --dry-run, so nothing is written to the registry.
#
# The npm side is a trusted-publisher entry that allows STAGING ONLY, so this
# workflow cannot publish even if edited to try. It was created (2026-09-24,
# trust id 6da11094-9f02-4e6e-844e-0f0a7909f2ca) with:
#
#     npx -y npm@11 trust github @agrippa87/memoria-mcp \
#       --file release.yml --repo Agripp87/memoria_mcp --allow-stage-publish
#
# Inspect with `npx -y npm@11 trust list @agrippa87/memoria-mcp`. Entries
# cannot be edited: renaming this file or the repository means
# `npm trust revoke --id=<id>` and re-running the command above. The owner,
# repository and file are case-sensitive, and package.json's repository.url
# must match this repository exactly. Every `npm trust` command asks for the
# maintainer's second factor.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm trusted publishing exchanges

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # Trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tag can be checked against main below.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; Node 24
          # ships an npm that qualifies. No cache: a release builds from a
          # clean install of the lockfile.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # A tag pushed from a branch would otherwise publish unreviewed code.
      - name: Tag must point at a commit on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main; releases are cut from main only."
            exit 1
          fi

      # npm would happily publish package.json's version under any tag name,
      # leaving the tag and the published package silently disagreeing.
      - name: Tag must match package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      # Fail with a clear message rather than an opaque auth error if the
      # runner image ever ships an npm too old for trusted publishing.
      - name: npm supports trusted publishing and staging
        run: |
          set -euo pipefail
          v="$(npm --version)"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            process.exit(ok ? 0 : 1);
          ' "$v" || { echo "::error::npm $v is older than 11.5.1, which trusted publishing requires."; exit 1; }
          # Checked by output, not exit code: an npm without `stage` prints
          # "Unknown command" and still exits 0, so `npm stage --help` alone
          # would pass on every version.
          npm stage --help 2>&1 | grep -q "npm stage publish" \
            || { echo "::error::npm $v has no 'stage' command, which staged publishing requires."; exit 1; }
          echo "npm $v, node $(node --version)"

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

      # The one check pull-request CI deliberately skips, because it downloads
      # a ~23MB model. A release is exactly when it matters: an embedding
      # dependency or dtype change that moved the vector space would leave
      # every existing store silently mixing two spaces, with no reindex
      # triggered. Proven to fail on a moved space, not merely to pass.
      - name: Embedding vector space unchanged
        run: npm run verify:vectors

      - name: Stage for approval
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          npm stage publish
          spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          {
            echo "## Staged, not yet public: \`$spec\`"
            echo
            echo "Inspect it, then approve with your authenticator:"
            echo
            echo '```sh'
            echo "npx -y npm@11 stage download $spec   # optional: inspect the tarball"
            echo "npx -y npm@11 stage approve $spec"
            echo '```'
            echo
            echo "Or discard it with \`npx -y npm@11 stage reject $spec\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Staging the real version would fail here: between releases main
      # carries a version that is already published, and npm refuses to stage
      # over it even in a dry run. A throwaway pre-release version exercises
      # the identical path. The package.json change never leaves the runner.
      - name: Rehearse staging (manual runs write nothing)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          npm version "${base}-rehearsal.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          npm stage publish --dry-run --tag rehearsal
