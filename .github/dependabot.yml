version: 2
updates:
  # npm — the MCP server. Grouped so a solo maintainer gets one PR to review a
  # week rather than a dozen; security updates still arrive as their own PRs.
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # better-sqlite3 majors need a native rebuild and a Docker image check;
      # bump it deliberately, not automatically.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not installable here yet: typescript-eslint (8.70.0,
      # the latest at time of writing) declares peer typescript ">=4.8.4
      # <6.1.0", so npm install fails with ERESOLVE before the compiler is
      # ever run. The only ways through are --legacy-peer-deps or dropping
      # typescript-eslint, and dropping it removes no-floating-promises --
      # the one rule the whole type-aware lint setup exists for.
      #
      # REMOVE THIS ENTRY once typescript-eslint widens that peer range past
      # 6.1.0. Until then the PR is red every week for a reason nothing in
      # this repo can fix.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  # GitHub Actions — all actions are pinned to commit shas, so this is how they
  # get updated at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Base image for the runtime container.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
